[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spleeterpt"
version = "0.1.0"
description = "Trainable PyTorch port of Deezer Spleeter"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.6,<3", "numpy>=1.26,<3", "soundfile>=0.12,<1", "scipy>=1.11,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
convert = ["tensorflow-cpu==2.18.1"]
evaluate = ["museval==0.4.1", "tensorflow-cpu==2.18.1", "pandas>=2.2,<4", "threadpoolctl>=3,<4"]
verify = ["tensorflow-cpu==2.18.1", "pandas>=2.2,<4"]

[project.scripts]
spleeterpt = "spleeterpt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spleeterpt = ["pretrained.json", "pretrained-notice.txt"]

[tool.setuptools]
license-files = ["LICENSE", "licenses/*.txt", "THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
