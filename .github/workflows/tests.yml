name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: python scripts/smoke_test.py
  tensorflow-parity:
    runs-on: ubuntu-latest
    env:
      TF_CPP_MIN_LOG_LEVEL: '2'
      OMP_NUM_THREADS: '2'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]' tensorflow-cpu==2.18.1
      - run: pytest -q tests/test_tensorflow_parity.py tests/test_evaluation_tools.py
