name: RunPod BatchNorm ablation
on:
  workflow_dispatch:
    inputs:
      confirm_paid_gpu:
        description: 'Evaluate pinned step-90 weights on ten full validation songs; four parameter/statistics combinations; one 30-minute PRO 6000 MIG 24GB lease, at most $0.69/hour'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: runpod-spleeterpt-smoke
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.repository == 'jasonjiang8866/spleeterpt' && github.ref == 'refs/heads/main' && inputs.confirm_paid_gpu
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SPT_EXPERIMENT: '41189465452-1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.4'
      - name: Install report validator dependency
        run: uv pip install --system --python python --no-sources numpy==2.0.2
      - name: Score four BN combinations on full validation recordings
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python runpod/control.py bn
      - name: Delete compute only; retain data and training checkpoints
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python runpod/control.py cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bn-ablation-${{ github.run_id }}-${{ github.run_attempt }}
          path: runpod-results/
          retention-days: 14
