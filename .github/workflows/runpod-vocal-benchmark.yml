name: RunPod Spleeter-2 vs Mel-Band RoFormer
on:
  workflow_dispatch:
    inputs:
      confirm_paid_vocal:
        description: 'One MIG 24GB <=$0.69/hour, 60-minute lease, existing Global Volume; $1 reserve, $500/month budget check; storage/request fees additional'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: runpod-spleeterpt-smoke
  cancel-in-progress: false
jobs:
  benchmark:
    if: github.repository == 'jasonjiang8866/spleeterpt' && github.ref == 'refs/heads/main' && inputs.confirm_paid_vocal
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.4'
      - run: uv pip install --system --python python --no-sources numpy==2.0.2
      - name: Check budget, launch once, validate and download results
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          SPT_BENCHMARK_PROFILE: 'vocal'
          SPT_CONFIRM_BENCHMARK: ${{ inputs.confirm_paid_vocal }}
        run: python runpod/benchmark_control.py
      - name: Delete compute only
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python runpod/control.py cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vocal-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: runpod-results/
          if-no-files-found: error
          retention-days: 14
