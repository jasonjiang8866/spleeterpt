name: RunPod bounded-memory inference measurement
on:
  workflow_dispatch:
    inputs:
      confirm_paid_benchmark:
        description: 'One RTX PRO 6000 MIG 24GB, <=$0.69/hour, 60-minute lease, $1 reserve; existing Global Volume only'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: runpod-spleeterpt-smoke
  cancel-in-progress: false
jobs:
  benchmark:
    if: github.repository == 'jasonjiang8866/spleeterpt' && github.ref == 'refs/heads/main' && inputs.confirm_paid_benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU-only lifecycle regressions before renting GPU
        run: python -m unittest discover -s runpod -p 'test_*.py' -v
      - name: Check budget, launch one MIG, measure, validate and retrieve results
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          SPT_BENCHMARK_PROFILE: bounded
          SPT_CONFIRM_BENCHMARK: ${{ inputs.confirm_paid_benchmark }}
        run: python runpod/benchmark_control.py
      - name: Delete compute only
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python runpod/control.py cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-memory-${{ github.run_id }}-${{ github.run_attempt }}
          path: runpod-results/
          if-no-files-found: error
          retention-days: 14
