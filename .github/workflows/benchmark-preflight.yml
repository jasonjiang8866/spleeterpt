name: Separator benchmark preflight (read-only)
on:
  workflow_dispatch:
  push:
    branches: [codex/htdemucs-preflight]
    paths:
      - runpod/benchmark_preflight.py
      - runpod/benchmark_budget.py
      - scripts/probe_htdemucs.py
      - .github/workflows/benchmark-preflight.yml
permissions:
  contents: read
jobs:
  inventory:
    if: github.repository == 'jasonjiang8866/spleeterpt'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe existing resources; never create compute or storage
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python runpod/benchmark_preflight.py
      - name: Check account budget without exposing balances
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python runpod/benchmark_budget.py
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-preflight-${{ github.run_id }}
          path: runpod-results/benchmark-*.json
          if-no-files-found: error
          retention-days: 14
  htdemucs-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Match intended Torch API without replacing CUDA dependencies on a Pod
        run: |
          python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install dora-search==0.1.12 einops==0.8.1 julius==0.2.7 lameenc==1.8.1 openunmix==1.3.0 pyyaml==6.0.2 tqdm==4.67.1
          python -m pip install --no-deps 'demucs @ git+https://github.com/facebookresearch/demucs.git@e976d93ecc3865e5757426930257e200846a520a'
      - name: Verify official weight bytes and real-model CPU compatibility
        run: python scripts/probe_htdemucs.py
      - uses: actions/upload-artifact@v4
        with:
          name: htdemucs-probe-${{ github.run_id }}
          path: runpod-results/htdemucs-probe.json
          if-no-files-found: error
          retention-days: 14
