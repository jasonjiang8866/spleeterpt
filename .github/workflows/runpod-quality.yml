name: RunPod quality preview
on:
  workflow_dispatch:
    inputs:
      confirm_paid_gpu:
        description: 'Rent one RTX 4090 for a 30-minute quality pilot lease (cleanup may be delayed)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: runpod-spleeterpt-smoke
  cancel-in-progress: false
jobs:
  smoke:
    if: github.repository == 'jasonjiang8866/spleeterpt' && github.ref == 'refs/heads/main' && inputs.confirm_paid_gpu
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.4'
      - name: Install report validator dependency
        run: uv pip install --system --python python --no-sources numpy==2.0.2
      - name: Preflight
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python runpod/control.py preflight
      - name: Evaluate real music previews and release Pod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python runpod/control.py quality
      - name: Retry cleanup for this run
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python runpod/control.py cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runpod-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: runpod-results/
          if-no-files-found: warn
          retention-days: 14
