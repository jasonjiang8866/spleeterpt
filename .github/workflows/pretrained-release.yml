name: Publish pretrained weights
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pretrained-weights-v1
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.repository == 'jasonjiang8866/spleeterpt'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: weights-v1.0.0
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '2'
      TF_CPP_MIN_LOG_LEVEL: '2'
      TF_ENABLE_ONEDNN_OPTS: '0'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: deezer/spleeter
          ref: c8854001ac8acad34a9bc2bd15f28475541828b1
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.4'
          enable-cache: true
      - name: Install fixed CPU conversion environment
        run: |
          uv sync --locked --group dev --group release
      - name: Downloader and packaging regression tests
        run: uv run --no-sync pytest -q tests/test_pretrained.py
      - name: Rebuild and validate official conversions
        run: |
          uv run --no-sync python scripts/build_pretrained_release.py \
            --work "$RUNNER_TEMP/pretrained-source" \
            --output "$RUNNER_TEMP/pretrained-release" \
            --upstream-root upstream \
            --catalog src/spleeterpt/pretrained.json
      - name: Create draft, verify uploaded bytes, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # gh release create refuses an existing release; never use --clobber.
          gh release create "$TAG" "$RUNNER_TEMP/pretrained-release/"* \
            --draft --target "$GITHUB_SHA" \
            --title "Official Spleeter PyTorch conversions — weights-v1.0.0" \
            --notes-file docs/pretrained-release.md
          gh release download "$TAG" --dir "$RUNNER_TEMP/pretrained-readback"
          cmp "$RUNNER_TEMP/pretrained-release/SHA256SUMS" "$RUNNER_TEMP/pretrained-readback/SHA256SUMS"
          cd "$RUNNER_TEMP/pretrained-readback"
          sha256sum --check "$RUNNER_TEMP/pretrained-release/SHA256SUMS"
          gh release edit "$TAG" --draft=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pretrained-release-${{ github.run_id }}
          path: ${{ runner.temp }}/pretrained-release/
          retention-days: 30
          if-no-files-found: warn
