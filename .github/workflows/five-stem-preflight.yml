name: Five-stem resource inventory (read-only)
on:
  workflow_dispatch:
  push:
    branches: [codex/five-stem-validation]
    paths: [runpod/five_stem_preflight.py, .github/workflows/five-stem-preflight.yml]
permissions:
  contents: read
jobs:
  inventory:
    if: github.repository == 'jasonjiang8866/spleeterpt'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: GET-only resource observation
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python runpod/five_stem_preflight.py
      - uses: actions/upload-artifact@v4
        with:
          name: five-stem-preflight-${{ github.run_id }}
          path: runpod-results/five-stem-preflight.json
          if-no-files-found: error
          retention-days: 14
