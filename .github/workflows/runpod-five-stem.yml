name: RunPod official five-stem inference measurement
on:
  workflow_dispatch:
    inputs:
      confirm_paid_benchmark:
        description: 'One RTX PRO 6000 MIG 24GB, <=$0.69/hour, 60-minute lease, $1 reserve; existing Global Volume only'
        type: boolean
        required: true
        default: false
      allow_4090_fallback:
        description: 'If MIG has no capacity, allow one RTX 4090 24GB at <=$1/hour; 60-minute lease, $2 project budget required'
        type: boolean
        required: true
        default: false
      cli_acceptance:
        description: 'Also measure the production CUDA CLI against the official TensorFlow CPU graph and long-file gates'
        type: boolean
        default: false
      cuda_cli_profile:
        description: 'CUDA profile for CLI acceptance (fft64 uses the five-stem CLI precision option)'
        type: choice
        default: default
        options:
          - default
          - fft64
      cuda_settings_study:
        description: 'Compare TF32, determinism and warmup on two frozen inputs (requires both CLI acceptance and FFT study)'
        type: boolean
        default: false
      cuda_precision_study:
        description: 'Compare FP64 analysis FFT, last decoder and output convolutions (requires CLI acceptance and FFT study)'
        type: boolean
        default: false
      fft_batch_study:
        description: 'Experimental pad-long-tail FFT policy; unchanged full-file reference and acceptance thresholds'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: runpod-spleeterpt-smoke
  cancel-in-progress: false
jobs:
  benchmark:
    if: github.repository == 'jasonjiang8866/spleeterpt' && github.ref == 'refs/heads/main' && inputs.confirm_paid_benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU-only lifecycle regressions before renting GPU
        run: python -m unittest discover -s runpod -p 'test_*.py' -v
      - name: Check budget, launch one MIG, measure, validate and retrieve results
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          SPT_BENCHMARK_PROFILE: five-stem
          SPT_CUDA_PRECISION_STUDY: ${{ inputs.cuda_precision_study }}
          SPT_CUDA_SETTINGS_STUDY: ${{ inputs.cuda_settings_study }}
          SPT_CUDA_CLI_PROFILE: ${{ inputs.cuda_cli_profile }}
          SPT_CLI_ACCEPTANCE: ${{ inputs.cli_acceptance }}
          SPT_FFT_BATCH_STUDY: ${{ inputs.fft_batch_study }}
          SPT_ALLOW_4090_FALLBACK: ${{ inputs.allow_4090_fallback }}
          SPT_CONFIRM_BENCHMARK: ${{ inputs.confirm_paid_benchmark }}
        run: python runpod/benchmark_control.py
      - name: Delete compute only
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python runpod/control.py cleanup
      - name: Recover downloaded evidence after verified compute deletion
        if: always() && hashFiles('runpod-results/listening-and-metrics.tar') != ''
        run: python runpod/five_stem_recovery.py --allow-rejected
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-stem-gpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: runpod-results/
          if-no-files-found: error
          retention-days: 14
