name: RunPod official five-stem inference measurement
on:
  push:
    branches: [main]
    paths: [.github/workflows/runpod-five-stem.yml]
  workflow_dispatch:
    inputs:
      confirm_paid_benchmark:
        description: 'One RTX PRO 6000 MIG 24GB, <=$0.69/hour, 60-minute lease, $1 reserve; existing Global Volume only'
        type: boolean
        required: true
        default: false
      allow_4090_fallback:
        description: 'If MIG has no capacity, allow one RTX 4090 24GB at <=$1/hour; 60-minute lease, $2 project budget required'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: runpod-spleeterpt-smoke
  cancel-in-progress: false
jobs:
  benchmark:
    if: github.repository == 'jasonjiang8866/spleeterpt' && github.ref == 'refs/heads/main' && (inputs.confirm_paid_benchmark || (github.event_name == 'push' && github.event.head_commit.message == 'Run approved five-stem FFT controls and piano completion (USD 2 cumulative cap)' && github.run_attempt == 1))
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU-only lifecycle regressions before renting GPU
        run: python -m unittest discover -s runpod -p 'test_*.py' -v
      - name: Check budget, launch one MIG, measure, validate and retrieve results
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          SPT_BENCHMARK_PROFILE: five-stem
          SPT_ALLOW_4090_FALLBACK: ${{ inputs.allow_4090_fallback }}
          SPT_CONFIRM_BENCHMARK: ${{ (inputs.confirm_paid_benchmark || (github.event_name == 'push' && github.event.head_commit.message == 'Run approved five-stem FFT controls and piano completion (USD 2 cumulative cap)' && github.run_attempt == 1)) }}
        run: python runpod/benchmark_control.py
      - name: Delete compute only
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python runpod/control.py cleanup
      - name: Recover downloaded evidence after verified compute deletion
        if: always() && hashFiles('runpod-results/listening-and-metrics.tar') != ''
        run: python runpod/five_stem_recovery.py --allow-rejected
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-stem-gpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: runpod-results/
          if-no-files-found: error
          retention-days: 14
