name: Five-stem CPU audio cross study
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'One DigitalOcean Premium Intel Droplet, USD 0.16/h maximum, 40 minutes, USD 1 total'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: spleeterpt-digitalocean-intel
  cancel-in-progress: false
jobs:
  calibration:
    if: github.repository == 'jasonjiang8866/spleeterpt' && github.ref == 'refs/heads/experiment/pr50-do-intel' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the registered TRIOS archive before creating a Droplet
        if: inputs.confirm
        timeout-minutes: 6
        run: |
          manifest=scripts/five_stem_corpus.json
          archive="$RUNNER_TEMP/trios.zip"
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            "$(jq -er '.trios_archive.url' "$manifest")" -o "$archive"
          test "$(stat -c %s "$archive")" = "$(jq -er '.trios_archive.bytes' "$manifest")"
          echo "$(jq -er '.trios_archive.sha256' "$manifest")  $archive" | sha256sum --check
      - name: Verify calibration and replay the two registered Intel holdouts
        timeout-minutes: 32
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: python3 experiments/digitalocean/intel.py ${{ inputs.confirm && 'run' || 'quote' }}
      - name: Delete the temporary Droplet and verify absence
        if: always()
        timeout-minutes: 4
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: python3 experiments/digitalocean/intel.py cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: do-intel-${{ github.run_id }}
          path: do-results/
          if-no-files-found: warn
