name: Five-stem CPU audio cross study
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: five-stem-audio-cross-${{ github.ref }}
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      TF_ENABLE_ONEDNN_OPTS: '0'
      TF_CPP_MIN_LOG_LEVEL: '2'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '2'
    steps:
      - name: Confirm Intel host
        run: |
          lscpu | sed -n '/Model name:/p'
          grep -qm1 GenuineIntel /proc/cpuinfo
      - uses: actions/checkout@v4
        with:
          ref: e63c8987fdf18a30c8d85785f1d680e08bc9430d
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.13.4'
          enable-cache: true
      - run: uv sync --locked --group dev --group release
      - name: Prepare only historical calibration inputs
        run: |
          git clone -q https://github.com/deezer/spleeter.git /tmp/upstream
          git -C /tmp/upstream checkout -q c8854001ac8acad34a9bc2bd15f28475541828b1
          uv run --no-sync python scripts/prepare_five_stem.py --work /tmp/weights
      - name: Measure the frozen native CPU separator
        run: uv run --no-sync python scripts/verify_native_five_stem.py --weights /tmp/weights --upstream-root /tmp/upstream --output /tmp/native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-cpu-intel
          path: /tmp/native.json
          if-no-files-found: warn
