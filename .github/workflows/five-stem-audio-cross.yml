name: Five-stem CPU audio cross study
on:
  workflow_dispatch:
    inputs:
      confirm_rental:
        description: 'Rent CPU3g only, up to 5 distinct regions, $0.16/hr, 40 minutes aggregate, $1 total budget'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: runpod-spleeterpt-smoke
  cancel-in-progress: false
jobs:
  calibration:
    if: inputs.confirm_rental && github.repository == 'jasonjiang8866/spleeterpt' && github.ref == 'refs/heads/experiment/pr50-runpod-intel'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probe CPUs and run the frozen Intel calibration
        env:
          CONFIRM_RENTAL: ${{ inputs.confirm_rental }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python3 runpod/native_intel_rental.py
      - name: Reconcile this run's Pods
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python3 runpod/control.py cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-intel-${{ github.run_id }}
          path: runpod-results/
          if-no-files-found: warn
