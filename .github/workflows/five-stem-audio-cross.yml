name: Five-stem CPU audio cross study
on:
  push:
    branches: [codex/pr50-frame-fft-amd-run]
    paths: [.github/workflows/five-stem-audio-cross.yml]
permissions:
  contents: read
jobs:
  study:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      TF_ENABLE_ONEDNN_OPTS: '0'
      TF_CPP_MIN_LOG_LEVEL: '2'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '2'
    steps:
      - name: Identify runner CPU
        id: cpu
        run: |
          lscpu | sed -n '/Vendor ID:/p;/Model name:/p'
          if grep -qm1 AuthenticAMD /proc/cpuinfo; then echo "amd=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.cpu.outputs.amd == 'true'
        with:
          ref: 67dbecd87ca86f4b4054ca2190ea1947dda9804b
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.cpu.outputs.amd == 'true'
        with:
          python-version: '3.12.16'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        if: steps.cpu.outputs.amd == 'true'
        with:
          version: '0.13.4'
          enable-cache: true
      - name: Run three CPU reproductions on AMD
        if: steps.cpu.outputs.amd == 'true'
        run: |
          uv sync --locked --group dev --group release
          git clone -q https://github.com/deezer/spleeter.git /tmp/upstream
          git -C /tmp/upstream checkout -q c8854001ac8acad34a9bc2bd15f28475541828b1
          uv run --no-sync python scripts/prepare_five_stem.py --work /tmp/weights
          mkdir -p /tmp/audio-cross
          for repeat in 1 2 3; do
            uv run --no-sync python scripts/study_audio_cross.py --decoder-cuts \
              --upstream-root /tmp/upstream --weights /tmp/weights \
              --replicate "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RUNNER_NAME}-${repeat}" \
              --output "/tmp/audio-cross/repeat-${repeat}.json"
          done
          uv run --no-sync python scripts/summarize_audio_cross.py /tmp/audio-cross/repeat-*.json --output /tmp/audio-cross/summary.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.cpu.outputs.amd == 'true'
        with:
          name: decoder-cuts-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/audio-cross/*.json
          if-no-files-found: error
