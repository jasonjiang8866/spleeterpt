name: Verify TRIOS piano reference inputs
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/register_trios.py
      - scripts/five_stem_corpus.json
      - .github/workflows/register-trios.yml
permissions:
  contents: read
jobs:
  register:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.0.2 soundfile==0.14.0
      - name: Verify licensed archive and fingerprint fixed excerpts without inference
        run: |
          curl --silent --show-error --fail --location --retry 2 --max-time 300 \
            'https://zenodo.org/records/6797837/files/TRIOS%20Dataset.zip?download=1' -o /tmp/trios.zip
          python scripts/register_trios.py /tmp/trios.zip /tmp/inputs.json --verify-manifest scripts/five_stem_corpus.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.13.4'
          enable-cache: true
      - name: Exercise the public corpus preparation entry point without inference
        run: |
          uv sync --locked --no-default-groups --group cpu
          mkdir -p /tmp/holdout
          mv /tmp/trios.zip /tmp/holdout/trios.zip
          uv run --no-sync python scripts/prepare_five_stem_corpus.py \
            --work /tmp/holdout --split holdout --require-piano-coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trios-input-hashes-${{ github.run_id }}
          path: /tmp/inputs.json
          if-no-files-found: warn
